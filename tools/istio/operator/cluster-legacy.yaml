apiVersion: install.istio.io/v1alpha1
kind: IstioOperator
spec:
  profile: default
  revision: ${istio_label}
  meshConfig:
    accessLogFile: /dev/stdout
    defaultConfig:
      holdApplicationUntilProxyStarts: true
  components:
    ingressGateways:
    - enabled: true
      name: istio-ingressgateway
      k8s:
        hpaSpec:
          minReplicas: 1
          maxReplicas: 1
    pilot:
      k8s:
        env:
          - name: PILOT_FILTER_GATEWAY_CLUSTER_CONFIG
            value: "true"
          - name: PILOT_HTTP10
            value: "true"
        overlays:
        - apiVersion: apps/v1
          kind: Deployment
          name: istiod-${istio_label}
        - apiVersion: autoscaling/v1
          kind: HorizontalPodAutoscaler
          name: istiod-${istio_label}
          patches:
          - path: spec.minReplicas
            value: 1
          - path: spec.maxReplicas
            value: 1
  values:
    global:
      variant: debug
      meshID: mesh1
      # cluster 差異參數化：由安裝腳本 envsubst 帶入每個 cluster 的值
      #   c1（multi / single 共用）：CLUSTER_NAME=cluster1 NETWORK_NAME=$NETWORK_CLUSTER1
      #   c2                        ：CLUSTER_NAME=cluster2 NETWORK_NAME=$NETWORK_CLUSTER2
      multiCluster:
        clusterName: ${CLUSTER_NAME}
      network: ${NETWORK_NAME}
